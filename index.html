<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D8DADC">
  <title>moji</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">

  <link rel="stylesheet" href="css/styles.css">
  <script src="js/emoji-data.js" defer></script>
  <script src="js/history.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body data-mode="idle">
  <h1 class="visually-hidden">moji</h1>

  <!-- workspace: the gray grid surrounding the canvas -->
  <div class="workspace" aria-hidden="true"></div>

  <!-- stage: renders the canvas and every emoji object from the document model -->
  <canvas class="stage" aria-label="artwork canvas"></canvas>

  <!-- floating controls -->
  <div class="controls">

    <!-- canvas label: follows the canvas, opens canvas properties -->
    <button class="glass canvas-label" type="button" aria-haspopup="dialog"
            aria-expanded="false" aria-controls="canvas-panel">canvas</button>

    <div class="control-bar control-bar--settings">
      <button class="glass control-button control-button--settings" type="button"
              data-name="settings" aria-label="settings" aria-disabled="true">
        <span class="emoji-icon" aria-hidden="true">⚙️</span>
        <svg class="icon icon--chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <polyline points="10 7 15 12 10 17"/>
        </svg>
      </button>
    </div>

    <div class="control-bar control-bar--tools">
      <!-- one continuous glass outline for the panel and its drop-down tab,
           redrawn by js as it morphs -->
      <div class="tools-shape" aria-hidden="true">
        <svg class="tools-shape__shadow" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="tools-shadow-soft" x="-30%" y="-40%" width="160%" height="200%">
              <feGaussianBlur stdDeviation="9"/>
            </filter>
            <filter id="tools-shadow-tight" x="-10%" y="-10%" width="120%" height="140%">
              <feGaussianBlur stdDeviation="0.8"/>
            </filter>
          </defs>
          <path class="tools-shape__shadow-soft" filter="url(#tools-shadow-soft)" transform="translate(0 6)"/>
          <path class="tools-shape__shadow-tight" filter="url(#tools-shadow-tight)" transform="translate(0 0.75)"/>
        </svg>
        <div class="tools-shape__glass"></div>
        <svg class="tools-shape__edge" xmlns="http://www.w3.org/2000/svg">
          <path/>
        </svg>
      </div>
      <div class="tools" data-expanded="false">
        <div class="tools__row" id="tools-row" inert>
          <button class="tool-button" type="button" data-tool="add" data-name="add" aria-label="add emoji" aria-pressed="false" style="--i: 5">
            <span class="emoji-icon" aria-hidden="true">➕</span>
          </button>
          <button class="tool-button" type="button" data-tool="delete" data-name="delete" aria-label="delete mode" aria-pressed="false" style="--i: 4">
            <span class="emoji-icon" aria-hidden="true">➖</span>
          </button>
          <button class="tool-button" type="button" data-tool="undo" data-name="undo" aria-label="undo" aria-disabled="true" style="--i: 3">
            <span class="emoji-icon" aria-hidden="true">↩️</span>
          </button>
          <button class="tool-button" type="button" data-tool="redo" data-name="redo" aria-label="redo" aria-disabled="true" style="--i: 2">
            <span class="emoji-icon" aria-hidden="true">↪️</span>
          </button>
          <button class="tool-button" type="button" data-tool="recenter" data-name="recenter" aria-label="recenter canvas" style="--i: 1">
            <span class="emoji-icon" aria-hidden="true">🎯</span>
          </button>
          <button class="tool-button" type="button" data-tool="export" data-name="export" aria-label="export png" style="--i: 0">
            <span class="emoji-icon" aria-hidden="true">✅</span>
          </button>
        </div>
        <button class="tools__anchor" type="button" aria-label="tools"
                aria-expanded="false" aria-controls="tools-row">
          <svg class="icon icon--chevron tools__chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <polyline points="14 7 9 12 14 17"/>
          </svg>
          <span class="emoji-icon" aria-hidden="true">🛠️</span>
        </button>
      </div>
      <!-- the button inside the drop-down tab under ➕ (placing) or ➖ (deleting) -->
      <div class="tools-drop" hidden>
        <button class="tool-button tools-drop__button" type="button" data-action="drop">
          <span class="emoji-icon" aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <!-- timeline: ⏳ opens the history of the active branch -->
    <div class="control-bar control-bar--timeline">
      <div class="glass timeline" data-open="false">
        <span class="timeline__track" aria-hidden="true"></span>
        <div class="timeline__panel" id="timeline-panel">
          <p class="timeline__status" aria-live="polite"></p>
          <div class="timeline__scrubber" role="slider" tabindex="0" aria-label="history position"
               aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
            <canvas class="timeline__ticks" aria-hidden="true"></canvas>
            <div class="timeline__fill" aria-hidden="true"></div>
            <div class="timeline__knob" aria-hidden="true"></div>
          </div>
          <div class="timeline__controls">
            <button class="tool-button" type="button" data-timeline="play" data-name="play" aria-label="play">
              <span class="emoji-icon" aria-hidden="true">▶️</span>
            </button>
            <button class="timeline__speed" type="button" data-timeline="speed" data-name="playback speed"
                    aria-label="playback speed">1×</button>
            <span class="timeline__spacer"></span>
            <button class="tool-button" type="button" data-timeline="branch" data-name="start from here"
                    aria-label="start a branch from here" hidden>
              <span class="emoji-icon" aria-hidden="true">🌱</span>
            </button>
            <button class="tool-button" type="button" data-timeline="branches" data-name="view branches"
                    aria-label="view branches">
              <span class="emoji-icon" aria-hidden="true">🌿</span>
            </button>
          </div>
        </div>
        <button class="timeline__toggle" type="button" data-name="timeline" aria-label="timeline"
                aria-expanded="false" aria-controls="timeline-panel">
          <span class="emoji-icon" aria-hidden="true">⏳</span>
        </button>
      </div>
    </div>

    <!-- caption: briefly names the button that was tapped, next to it -->
    <p class="glass caption" aria-hidden="true" hidden></p>

    <!-- transient status message (export or autosave problems only) -->
    <div class="control-bar control-bar--toast">
      <p class="glass toast" role="status" aria-live="polite" hidden></p>
    </div>

  </div>

  <!-- object menu: actions for the selected emoji (opens by tapping the selection while editing) -->
  <div class="glass panel object-menu" role="menu" aria-label="emoji actions" hidden>
    <div class="object-menu__row">
      <button class="menu-button" type="button" role="menuitem" data-menu="duplicate" data-name="duplicate">duplicate</button>
      <button class="menu-button" type="button" role="menuitem" data-menu="group" data-name="group">group</button>
      <button class="menu-button" type="button" role="menuitem" data-menu="ungroup" data-name="ungroup">ungroup</button>
    </div>
    <div class="object-menu__row">
      <button class="menu-button" type="button" role="menuitem" data-menu="front" data-name="bring to front">to front</button>
      <button class="menu-button" type="button" role="menuitem" data-menu="forward" data-name="bring forward">forward</button>
      <button class="menu-button" type="button" role="menuitem" data-menu="backward" data-name="send backward">backward</button>
      <button class="menu-button" type="button" role="menuitem" data-menu="back" data-name="send to back">to back</button>
    </div>
  </div>

  <!-- branches: switch, rename, delete (from 🌿 in the timeline) -->
  <section class="glass panel branches" aria-label="branches" hidden>
    <header class="branches__header">
      <h2 class="branches__title">branches</h2>
      <span class="branches__count"></span>
    </header>
    <ul class="branches__list"></ul>
  </section>

  <!-- canvas properties -->
  <div class="glass panel canvas-panel" id="canvas-panel" role="dialog" aria-label="canvas properties" hidden>
    <div class="segmented canvas-panel__ratios" role="group" aria-label="aspect ratio">
      <button class="segmented__item" type="button" data-width="1080" data-height="1920">9:16</button>
      <button class="segmented__item" type="button" data-width="1080" data-height="1350">4:5</button>
      <button class="segmented__item" type="button" data-width="1080" data-height="1080">1:1</button>
      <button class="segmented__item" type="button" data-width="1080" data-height="1440">3:4</button>
      <button class="segmented__item" type="button" data-width="1920" data-height="1080">16:9</button>
    </div>
    <form class="canvas-panel__size" novalidate>
      <label class="dimension">
        <span class="dimension__label" aria-hidden="true">w</span>
        <input class="dimension__input" type="number" name="width" inputmode="numeric"
               min="64" max="4096" step="1" required aria-label="width in pixels">
      </label>
      <span class="canvas-panel__times" aria-hidden="true">×</span>
      <label class="dimension">
        <span class="dimension__label" aria-hidden="true">h</span>
        <input class="dimension__input" type="number" name="height" inputmode="numeric"
               min="64" max="4096" step="1" required aria-label="height in pixels">
      </label>
      <button class="apply-button" type="submit">apply</button>
    </form>
  </div>

  <!-- emoji picker -->
  <section class="glass panel picker" id="picker" aria-label="emoji picker" data-size="compact" tabindex="-1" hidden>
    <div class="picker__header">
      <button class="picker__grabber" type="button" aria-label="expand emoji picker"><span aria-hidden="true"></span></button>
      <div class="picker__bar">
        <label class="picker__search-field">
          <svg class="icon picker__search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="6"/>
            <line x1="15.5" y1="15.5" x2="19.5" y2="19.5"/>
          </svg>
          <input class="picker__search" type="search" placeholder="search" aria-label="search emoji"
                 autocomplete="off" autocapitalize="off" spellcheck="false">
        </label>
        <nav class="picker__categories" aria-label="emoji categories"></nav>
      </div>
    </div>
    <div class="picker__grid"></div>
  </section>
</body>
</html>
